name: nexora-commerce

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora_commerce_net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora_commerce_net

  backend:
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexora_commerce_net

  frontend:
    env_file:
      - ../.env
    depends_on:
      - backend
    networks:
      - nexora_commerce_net

  k6:
    image: grafana/k6:latest
    profiles:
      - loadtest
    volumes:
      - ./k6-tests:/scripts
    command: run /scripts/test.js
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexora_commerce_net

volumes:
  postgres_data:
  redis_data:
  maven_cache:
  frontend_node_modules:

networks:
  nexora_commerce_net:
    name: nexora_commerce_net
