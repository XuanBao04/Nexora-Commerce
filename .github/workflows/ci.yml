name: Nexora Commerce Test Pipeline

on:
  push:
    branches: [ "main","bao/backend","thanh/frontend", "wolf"]
  pull_request:
    branches: [ "main", "bao/backend", "thanh/frontend", "wolf"]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode clean test

      - name: Collect backend test reports
        if: always()
        run: |
          mkdir -p test-artifacts/backend
          echo "Backend test reports" > test-artifacts/backend/README.txt
          if [ -d backend/target/surefire-reports ]; then
            cp -R backend/target/surefire-reports test-artifacts/backend/
          fi
          if [ -d backend/target/site/jacoco ]; then
            cp -R backend/target/site/jacoco test-artifacts/backend/
          fi

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-artifacts/backend/
          if-no-files-found: error
          retention-days: 14
