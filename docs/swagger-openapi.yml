components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          maxLength: 100
          minLength: 0
          type: string
        email:
          maxLength: 100
          minLength: 0
          type: string
        password:
          maxLength: 2147483647
          minLength: 6
          type: string
    ApiResponseUserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserProfileResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
    UserAddressRequest:
      required:
      - addressLine
      - phoneNumber
      - receiverName
      type: object
      properties:
        receiverName:
          maxLength: 100
          minLength: 0
          type: string
        phoneNumber:
          maxLength: 20
          minLength: 0
          type: string
        addressLine:
          maxLength: 255
          minLength: 0
          type: string
        isDefault:
          type: boolean
    ApiResponseUserAddressResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserAddressResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    UserAddressResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        receiverName:
          type: string
        phoneNumber:
          type: string
        addressLine:
          type: string
        isDefault:
          type: boolean
    ProductFormRequest:
      required:
      - name
      - price
      - status
      type: object
      properties:
        id:
          maxLength: 100
          minLength: 0
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        description:
          maxLength: 1000
          minLength: 0
          type: string
        price:
          type: integer
          format: int64
        status:
          type: string
        image:
          type: string
          format: binary
    ApiResponseProductResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProductResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    ProductResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
        status:
          type: string
        imageUrl:
          type: string
        imagePublicId:
          type: string
    UpdateCouponRequest:
      type: object
      properties:
        discountPercent:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
        active:
          type: boolean
        minimumOrderAmount:
