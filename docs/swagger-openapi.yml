openapi: 3.0.1
info:
  title: Nexora-Commerce REST API
  description: E-Commerce high-performance RESTful API documentation for frontend
    integration.
  contact:
    name: Nexora Core Dev Team
    email: dev@nexoracommerce.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Authentication Module
  description: Endpoints for user session login, registration, token refresh, and
    profiles
- name: Product Module
  description: Endpoints for catalog, pricing, and variant administration
- name: Category Module
  description: Endpoints for category hierarchies, list retrieval, and administration
- name: Cart Module
  description: Endpoints for active user shopping carts, adding/removing items, and
    clearing carts
- name: Order Module
  description: Endpoints for order calculation previews, creation, user history listings,
    cancellations, and status management
paths:
  /api/v1/users/{userId}/profile:
    get:
      tags:
      - user-controller
      operationId: getUserProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfileResponse'
    put:
      tags:
      - user-controller
      operationId: updateProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfileResponse'
  /api/v1/users/{userId}/addresses/{addressId}:
    put:
      tags:
      - user-controller
      operationId: updateAddress
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseUserAddressResponse'
    delete:
      tags:
      - user-controller
      operationId: deleteAddress
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/products/{productId}:
    get:
      tags:
      - Product Module
      summary: Retrieve product details by product ID
      description: Fetches complete details for a single product catalog item by its
        custom code.
      operationId: getProductById
      parameters:
      - name: productId
        in: path
        description: The unique product code
        required: true
        schema:
          type: string
        example: P001
      responses:
        '200':
          description: Product details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '404':
          description: Product not found under the provided ID
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
    put:
      tags:
      - Product Module
      summary: Update an existing product item
      description: Requires ADMIN role. Modifies properties and uploads/updates product
        images.
      operationId: updateProduct
      parameters:
      - name: productId
        in: path
        description: The unique product code
        required: true
        schema:
          type: string
        example: P001
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ProductFormRequest'
      responses:
        '403':
          description: Insufficient permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '400':
          description: Input validation failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '404':
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '200':
          description: Product successfully updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Product Module
      summary: Delete a single product item
      description: Requires ADMIN role. Permanently removes a product from the database
        catalog.
      operationId: deleteProduct
      parameters:
      - name: productId
        in: path
        description: The unique product code
        required: true
        schema:
          type: string
        example: P001
      responses:
        '403':
          description: Insufficient permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '404':
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '200':
          description: Product deleted successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
      security:
      - bearerAuth: []
  /api/v1/coupons/{code}:
    get:
      tags:
      - coupon-controller
      operationId: getCoupon
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCouponResponse'
    put:
      tags:
      - coupon-controller
      operationId: updateCoupon
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCouponResponse'
    delete:
      tags:
      - coupon-controller
      operationId: deleteCoupon
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/categories/{categoryId}:
    put:
      tags:
      - Category Module
      summary: Update an existing category
      description: Requires ADMIN role. Edits details such as category name, icon,
        slug, or parent reference.
      operationId: updateCategory
      parameters:
      - name: categoryId
        in: path
        description: Category database ID
        required: true
        schema:
          type: integer
          format: int64
        example: 12
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '400':
          description: Input validation parameters failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '200':
          description: Category successfully updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '404':
          description: Category not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '403':
          description: Insufficient role permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Category Module
      summary: Delete an existing category
      description: Requires ADMIN role. Permanently removes a category and unbinds
        its children.
      operationId: deleteCategory
      parameters:
      - name: categoryId
        in: path
        description: Category database ID
        required: true
        schema:
          type: integer
          format: int64
        example: 12
      responses:
        '404':
          description: Category not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '403':
          description: Insufficient role permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '200':
          description: Category deleted successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
      security:
      - bearerAuth: []
  /api/v1/brands/{brandId}:
    put:
      tags:
      - brand-controller
      operationId: updateBrand
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseBrandResponse'
    delete:
      tags:
      - brand-controller
      operationId: deleteBrand
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/admin/stocks/{productId}:
    get:
      tags:
      - admin-stock-controller
      operationId: getProductStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseStockStatus'
    put:
      tags:
      - admin-stock-controller
      operationId: setProductStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockQuantityRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    delete:
      tags:
      - admin-stock-controller
      operationId: deleteProductStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/wishlists/{userId}/items:
    post:
      tags:
      - wishlist-controller
      operationId: addToWishlist
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseWishlistResponse'
  /api/v1/users/{userId}/addresses:
    get:
      tags:
      - user-controller
      operationId: getUserAddresses
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListUserAddressResponse'
    post:
      tags:
      - user-controller
      operationId: addUserAddress
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseUserAddressResponse'
  /api/v1/reviews:
    post:
      tags:
      - product-review-controller
      operationId: createReview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductReviewResponse'
  /api/v1/products:
    get:
      tags:
      - Product Module
      summary: Search products by keyword
      description: Performs a text-based fuzzy search for products containing the
        keyword in their name or description.
      operationId: getAllProducts_1
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      - name: keyword
        in: query
        description: Search phrase or term
        required: true
        schema:
          type: string
        example: iPhone
      responses:
        '200':
          description: Search results page retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListProductResponse'
        '400':
          description: Missing or empty keyword parameter
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListProductResponse'
    post:
      tags:
      - Product Module
      summary: Create a new product item
      description: Requires ADMIN role. Stores a new product entry along with multipart
        image file attachments.
      operationId: createProduct
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ProductFormRequest'
      responses:
        '403':
          description: Insufficient permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '400':
          description: Input validation failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '201':
          description: Product successfully created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProductResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Product Module
      summary: Bulk delete products (Disabled)
      description: Requires ADMIN role. Always fails with a 403 status to prevent
        bulk deletion accidents.
      operationId: deleteAllProducts
      responses:
        '403':
          description: Bulk deletion is disabled for safety
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
      security:
      - bearerAuth: []
  /api/v1/orders:
    get:
      tags:
      - Order Module
      summary: List customer-specific order history
      description: Fetches a paginated history list of orders for a specific user
        ID. Requires matching userId or ADMIN role.
      operationId: getAllOrders_1
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      - name: userId
        in: query
        description: Customer ID associated with orders
        required: true
        schema:
          type: string
        example: USR-001
      responses:
        '403':
          description: Insufficient permissions
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListOrderResponse'
        '200':
          description: Customer orders page retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListOrderResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListOrderResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Order Module
      summary: Create a new checkout order
      description: Processes shopping cart details and creates a pending checkout
        transaction. Requires matching userId or ADMIN role.
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '201':
          description: Order successfully created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '403':
          description: Insufficient role permissions
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '400':
          description: Validation parameters failed or cart empty
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
      security:
      - bearerAuth: []
  /api/v1/orders/previews:
    post:
      tags:
      - Order Module
      summary: Generate an order pricing calculation preview
      description: Computes subtotal, coupon discounts, shipping costs, and final
        totals before actual placement. Does not alter cart state.
      operationId: previewOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '400':
          description: Input validation failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderPreviewResponse'
        '200':
          description: Pricing preview computed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderPreviewResponse'
        '403':
          description: Insufficient role permissions
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderPreviewResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderPreviewResponse'
      security:
      - bearerAuth: []
  /api/v1/inventories/{productId}/stock-reservations:
    post:
      tags:
      - inventory-controller
      operationId: reserveStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/inventories/{productId}/stock-releases:
    post:
      tags:
      - inventory-controller
      operationId: releaseStock
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/coupons:
    get:
      tags:
      - coupon-controller
      operationId: getAllCoupons
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListCouponResponse'
    post:
      tags:
      - coupon-controller
      operationId: createCoupon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCouponResponse'
  /api/v1/checkouts:
    post:
      tags:
      - checkout-controller
      operationId: checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
  /api/v1/checkouts/orders/{orderId}/payments:
    post:
      tags:
      - checkout-controller
      operationId: processPayment
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentResponse'
  /api/v1/categories:
    get:
      tags:
      - Category Module
      summary: Get full category tree structure
      description: Fetches categories in a hierarchical nested structure (parent-child
        trees).
      operationId: getCategoryTree
      responses:
        '200':
          description: Category tree retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListCategoryResponse'
    post:
      tags:
      - Category Module
      summary: Create a new category
      description: Requires ADMIN role. Adds a new category level to the catalog hierarchy.
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '400':
          description: Input validation parameters failed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '201':
          description: Category successfully created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '403':
          description: Insufficient role permissions (must be ADMIN)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
      security:
      - bearerAuth: []
  /api/v1/carts/{userId}/items:
    post:
      tags:
      - Cart Module
      summary: Add an item to the shopping cart
      description: Requires standard authenticated user matching the userId or ADMIN
        role. Adds product variant item to cart.
      operationId: addCartItem
      parameters:
      - name: userId
        in: path
        description: Customer ID associated with the cart
        required: true
        schema:
          type: string
        example: USR-001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
        required: true
      responses:
        '400':
          description: Validation parameters failed or product not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
        '201':
          description: Item successfully added to cart
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
        '403':
          description: Insufficient permissions
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
        '401':
          description: Authentication token missing or invalid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
      security:
      - bearerAuth: []
  /api/v1/brands:
    get:
      tags:
      - brand-controller
      operationId: getAllBrands
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListBrandResponse'
    post:
      tags:
      - brand-controller
      operationId: createBrand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseBrandResponse'
  /api/v1/authentications/tokens:
    post:
      tags:
      - Authentication Module
      summary: Refresh JWT access token
      description: Generates a new JWT access token using the HttpOnly refresh token
        cookie.
      operationId: refresh
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '401':
          description: Refresh token missing, invalid, or expired
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
  /api/v1/authentications/sessions:
    post:
      tags:
      - Authentication Module
      summary: User session login
      description: Authenticates user credentials. Returns JWT access token in the
        response and sets a secure HttpOnly refresh token cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '401':
          description: Invalid credentials provided
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '400':
          description: Invalid validation parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '200':
          description: Login successful, tokens generated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
    delete:
      tags:
      - Authentication Module
      summary: User logout
      description: Revokes user refresh token and clears the secure HttpOnly cookie.
      operationId: logout
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Logout successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/authentications/registrations:
