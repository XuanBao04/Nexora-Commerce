spring:
  jpa:
    hibernate:
      ddl-auto: validate
      timeout: 3600 # 1 hour
      max-idle-connections: 5
      keep-alive-duration: 5 # 5 minutes
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    repair: true

logging:
  level:
    com.nexoracommerce: DEBUG