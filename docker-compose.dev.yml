services:
  db:
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    env_file:
      - ./.env
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "${SERVER_PORT}:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  maven_cache:
  frontend_node_modules:
